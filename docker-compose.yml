services:
  api:
    container_name: LibreChat
    ports:
      - "${PORT}:${PORT}"
    depends_on:
      - mongodb
      - rag_api
      # - redis
    build:
      context: ./docker/librechat
      dockerfile: Dockerfile
    restart: always
    user: "${UID}:${GID}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - HOST=0.0.0.0
      - MONGO_URI=mongodb://mongodb:27017/LibreChat
      - MEILI_HOST=http://meilisearch:7700
      - RAG_PORT=${RAG_PORT:-8000}
      - RAG_API_URL=http://rag_api:${RAG_PORT:-8000}
    volumes:
      - type: bind
        source: ./.env
        target: /app/.env
        read_only: true
      - type: bind
        source: ./librechat.yaml
        target: /app/librechat.yaml
        read_only: true
      - ./data/images:/app/client/public/images
      - ./data/uploads:/app/uploads
      - ./data/logs:/app/api/logs

  mongodb:
    container_name: chat-mongodb
    build:
      context: ./docker/mongodb
      dockerfile: Dockerfile
    restart: always
    user: "${UID}:${GID}"
    volumes:
      - ./data/mongodb:/data/db
    command: mongod --noauth

  meilisearch:
    container_name: chat-meilisearch
    build:
      context: ./docker/meilisearch
      dockerfile: Dockerfile
    restart: always
    user: "${UID}:${GID}"
    env_file:
      - .env 
    volumes:
      - meili_data:/meili_data
    ports:
      - "7700:7700"

  vectordb:
    container_name: vectordb
    build:
      context: ./docker/pgvectordb
      dockerfile: Dockerfile
    environment:
      POSTGRES_DB: mydatabase
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
    restart: always
    user: "${UID}:${GID}"
    volumes:
      - ./data/pgvector:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  rag_api:
    container_name: rag_api
    build:
      context: ./docker/rag
      dockerfile: Dockerfile
    environment:
      - DB_HOST=vectordb
      - RAG_PORT=${RAG_PORT:-8000}
      - POSTGRES_DB=mydatabase
      - POSTGRES_USER=myuser
      - POSTGRES_PASSWORD=mypassword
    ports:
      - "${RAG_PORT:-8000}:${RAG_PORT:-8000}"
    restart: always
    user: "${UID}:${GID}"
    depends_on:
      - vectordb
    env_file:
      - .env

  ollama:
    container_name: ollama
    build:
      context: ./docker/ollama
      dockerfile: Dockerfile
    restart: always
    ports:
      - "11434:11434"
    user: "${UID}:${GID}"
    volumes:
      - ./data/ollama:/root/.ollama
    environment:
      - OLLAMA_NO_ANALYTICS=true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  ollama-init:
    container_name: ollama-init
    build:
      context: ./docker/ollama
      dockerfile: Dockerfile
    restart: "no"
    user: "${UID}:${GID}"
    depends_on:
      - ollama
    volumes:
      - ./data/ollama:/root/.ollama
    environment:
      - OLLAMA_NO_ANALYTICS=true
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull tinyllama"]

